<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SENA - SIGIE | Iniciar Sesión</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="page">
    <header class="topbar">
      <div class="topbar__left">
        <img class="topbar__icon" src="logosigie.png" alt="Logo SIGIE">
        <h1>SENA - SIGIE | Sistema de Gestión de Ingreso y Elementos | Iniciar Sesión</h1>
      </div>
      <img class="topbar__sena" src="logosena.png" alt="SENA">
    </header>

    <main class="main">
      <section class="login">
        <div class="login__badge">
          <img src="logosigie.png"  alt="Logo SIGIE" >
        </div>

        <form id="loginForm" novalidate>
          <div class="field">
            <label for="usuario">Usuario</label>
            <input type="text" id="usuario" name="usuario" autocomplete="username" required>
          </div>

          <div class="field">
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" autocomplete="current-password" required>
          </div>

          <div class="options">
            <label class="remember">
              <input type="checkbox" id="recordar"> Recordar sesión
            </label>
            <a href="#" id="olvido">¿Olvidó su contraseña?</a>
          </div>

          <p class="error" id="error" role="alert" hidden></p>

          <button type="submit" class="btn">Iniciar Sesión</button>
        </form>
      </section>
    </main>
  </div>

  <script src="inicio_sesion.js"></script>
</body>
</html>
